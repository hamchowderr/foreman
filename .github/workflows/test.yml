name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same PR / branch when a new push lands.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agents:
    name: agents (vitest + AIMock)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fail fast if aimock.json's declared MCP tools / A2A agents drift away
      # from their backing fixtures, or if a catch-all LLM fixture sneaks back
      # in. Cheap, no services — run before the (slower) test suite.
      - name: Verify AIMock fixture coverage
        run: cd packages/agents && npm run verify:aimock
      # AIMock is started in-process by packages/agents/tests/aimock-setup.ts
      # (vitest globalSetup) — no separate action needed. Real Anthropic and
      # Zapier creds are deliberately absent so any leak into a non-mocked
      # path fails loudly instead of silently calling production.
      - run: npm test
        env:
          NODE_ENV: test
          DUCKDB_PATH: ./data/test.duckdb

  typecheck:
    name: agents (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `mastra build` / vitest transpile with esbuild (no type-checking), so
      # type errors never gated before — this runs `tsc --noEmit` over src + tests.
      - name: Typecheck agents
        run: cd packages/agents && npm run typecheck

  web:
    name: web (next build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build web (also type-checks)
        run: cd packages/web && npm run build

  lint:
    name: lint (biome)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Biome check (lint + format)
        run: npm run lint

  deps:
    name: dep uniqueness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # check-dep-uniqueness.mjs runs as part of postinstall, so npm ci alone
      # validates that there are no duplicate-resolved versions across the
      # workspace. A bare `npm ci` failure here is a real signal.
      - run: npm ci

  db-types:
    name: db types fresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          # Pinned (not `latest`) so the action downloads a fixed release asset
          # instead of making an unauthenticated GitHub API call to resolve the
          # newest version — that call is rate-limited on shared runners and
          # flaked this job ("Failed to resolve latest Supabase CLI release:
          # rate limit exceeded", foreman-fjl3). Bump deliberately when needed.
          version: 2.109.0
      - run: npm ci
      - name: Start local Supabase (db + meta only)
        # `db:types:check` only needs the database + postgres-meta to introspect
        # the schema, but a full `supabase start` also pulls studio, inbucket, …
        # from public.ecr.aws unauthenticated. Anonymous ECR pulls are capped at
        # 1/sec per IP, so on shared runners the extra images intermittently trip
        # "toomanyrequests" (exit 125) — and that error can also mask a Docker
        # disk-space exhaustion. Excluding the heavy unneeded images cuts both
        # the pull count and disk use; the CLI already retries pulls with
        # exponential backoff internally (foreman-x8rj). Keep kong/rest/auth so
        # the post-start health check still passes. Escalation levers if it ever
        # recurs: SUPABASE_INTERNAL_IMAGE_REGISTRY=docker.io, or a free-disk step.
        run: npx supabase start -x studio,inbucket
      - name: Verify generated types match migrations
        # The latest supabase CLI checks for an access token *before* it will run
        # local type-gen in CI; the value is never used (--local introspects the
        # local DB). A placeholder satisfies the presence check.
        env:
          SUPABASE_ACCESS_TOKEN: sbp_0000000000000000000000000000000000000000
        run: cd packages/agents && npm run db:types:check
